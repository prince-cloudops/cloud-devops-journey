services:
  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - lb-net

  backend-1:
    build: .
    container_name: backend-1
    networks:
      - lb-net

  backend-2:
    build: .
    container_name: backend-2
    networks:
      - lb-net

networks:
  lb-net:
    driver: bridge
