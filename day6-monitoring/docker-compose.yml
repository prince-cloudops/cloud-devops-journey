services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitor-net

  stress-workload:
    image: alpine
    container_name: stress-workload
    command: /bin/sh -c "while true; do ping -c 1 127.0.0.1 > /dev/null; sleep 0.1; done"
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge
