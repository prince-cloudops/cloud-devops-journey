services:
  web:
    build: .
    container_name: web-app
    ports:
      - "5000:5000"
    depends_on:
      - redis-db
    networks:
      - app-network

  redis-db:
    image: redis:alpine
    container_name: redis-db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
